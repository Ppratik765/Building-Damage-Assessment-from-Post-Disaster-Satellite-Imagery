<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Siamese network architecture with shared ResNet-50 encoder and two FPN decoders">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#EA580C"/></marker>
<style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}@keyframes flow{to{stroke-dashoffset:-24}}.f{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.n{animation:up .7s both}</style></defs>
<rect width="1200" height="460" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
<g class="t" text-anchor="middle">
<g class="n" style="animation-delay:.1s"><rect x="30" y="50" width="170" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB"/><text x="115" y="84" font-size="20" font-weight="700" fill="#1E3A8A">Pre-event tile</text><text x="115" y="110" font-size="16" fill="#334155">3 × 1024 × 1024</text></g>
<g class="n" style="animation-delay:.2s"><rect x="30" y="300" width="170" height="80" rx="12" fill="#FFEDD5" stroke="#EA580C"/><text x="115" y="334" font-size="20" font-weight="700" fill="#7C2D12">Post-event tile</text><text x="115" y="360" font-size="16" fill="#334155">3 × 1024 × 1024</text></g>
<g class="n" style="animation-delay:.4s"><rect x="290" y="50" width="210" height="80" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="395" y="84" font-size="20" font-weight="700" fill="#0F172A">ResNet-50 encoder</text><text x="395" y="110" font-size="16" fill="#334155">ImageNet weights</text></g>
<g class="n" style="animation-delay:.5s"><rect x="290" y="300" width="210" height="80" rx="12" fill="#fff" stroke="#EA580C" stroke-width="2"/><text x="395" y="334" font-size="20" font-weight="700" fill="#0F172A">ResNet-50 encoder</text><text x="395" y="360" font-size="16" fill="#334155">same weights (shared)</text></g>
<path d="M395 130V300" stroke="#64748B" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
<rect x="340" y="196" width="110" height="28" rx="14" fill="#E2E8F0"/><text x="395" y="216" font-size="15" font-weight="600" fill="#334155">tied weights</text>
<g class="n" style="animation-delay:.7s"><rect x="590" y="50" width="130" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB"/><text x="655" y="86" font-size="22" font-weight="700" fill="#1E3A8A">F_pre</text><text x="655" y="112" font-size="15" fill="#334155">5-level features</text></g>
<g class="n" style="animation-delay:.8s"><rect x="590" y="300" width="130" height="80" rx="12" fill="#FFEDD5" stroke="#EA580C"/><text x="655" y="336" font-size="22" font-weight="700" fill="#7C2D12">F_post</text><text x="655" y="362" font-size="15" fill="#334155">5-level features</text></g>
<g class="n" style="animation-delay:1s"><rect x="590" y="175" width="130" height="70" rx="12" fill="#F3E8FF" stroke="#9333EA"/><text x="655" y="204" font-size="16" font-weight="700" fill="#581C87">|F_pre − F_post|</text><text x="655" y="228" font-size="14" fill="#6B21A8">‖ F_post</text></g>
<g class="n" style="animation-delay:1.2s"><rect x="820" y="50" width="190" height="80" rx="12" fill="#fff" stroke="#16A34A" stroke-width="2"/><text x="915" y="84" font-size="19" font-weight="700" fill="#14532D">FPN decoder</text><text x="915" y="110" font-size="15" fill="#334155">BCE + Dice</text></g>
<g class="n" style="animation-delay:1.3s"><rect x="820" y="300" width="190" height="80" rx="12" fill="#fff" stroke="#DC2626" stroke-width="2"/><text x="915" y="334" font-size="19" font-weight="700" fill="#7F1D1D">FPN decoder</text><text x="915" y="360" font-size="15" fill="#334155">weighted cross-entropy</text></g>
<g class="n" style="animation-delay:1.5s"><rect x="1050" y="50" width="130" height="80" rx="12" fill="#DCFCE7" stroke="#16A34A"/><text x="1115" y="86" font-size="18" font-weight="700" fill="#14532D">Building</text><text x="1115" y="110" font-size="18" font-weight="700" fill="#14532D">footprints</text></g>
<g class="n" style="animation-delay:1.6s"><rect x="1050" y="300" width="130" height="80" rx="12" fill="#FEE2E2" stroke="#DC2626"/><text x="1115" y="336" font-size="18" font-weight="700" fill="#7F1D1D">4-class</text><text x="1115" y="360" font-size="18" font-weight="700" fill="#7F1D1D">damage map</text></g>
</g>
<g fill="none" stroke-width="3" stroke-linecap="round">
<path class="f" d="M200 90H290" stroke="#2563EB" marker-end="url(#a)"/><path class="f" d="M500 90H590" stroke="#2563EB" marker-end="url(#a)"/><path class="f" d="M720 90H820" stroke="#2563EB" marker-end="url(#a)"/><path class="f" d="M1010 90H1050" stroke="#2563EB" marker-end="url(#a)"/>
<path class="f" d="M200 340H290" stroke="#EA580C" marker-end="url(#o)"/><path class="f" d="M500 340H590" stroke="#EA580C" marker-end="url(#o)"/>
<path class="f" d="M655 130V175" stroke="#9333EA"/><path class="f" d="M655 300V245" stroke="#9333EA"/>
<path class="f" d="M720 210H770V340H820" stroke="#9333EA" marker-end="url(#a)"/><path class="f" d="M1010 340H1050" stroke="#EA580C" marker-end="url(#o)"/></g>
<text class="t" x="600" y="432" text-anchor="middle" font-size="18" fill="#475569">One shared encoder reads both images; the damage decoder sees what changed and what the building looks like now.</text>
</svg>
