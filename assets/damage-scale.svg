<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="xBD joint damage scale, four tiers">
<style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.c{animation:up .8s both}.c1{animation-delay:.1s}.c2{animation-delay:.3s}.c3{animation-delay:.5s}.c4{animation-delay:.7s}</style>
<rect width="1200" height="220" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
<g class="t"><g class="c c1"><rect x="24" y="24" width="276" height="172" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/><text x="44" y="68" font-size="30" font-weight="700" fill="#14532D">0 · No damage</text><text x="44" y="104" font-size="20" fill="#166534">Intact roof and walls</text><circle cx="262" cy="60" r="14" fill="#22C55E"/></g>
<g class="c c2"><rect x="318" y="24" width="276" height="172" rx="16" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/><text x="338" y="68" font-size="30" font-weight="700" fill="#713F12">1 · Minor</text><text x="338" y="104" font-size="20" fill="#854D0E">Missing tiles, gutters</text><circle cx="556" cy="60" r="14" fill="#EAB308"/></g>
<g class="c c3"><rect x="612" y="24" width="276" height="172" rx="16" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/><text x="632" y="68" font-size="30" font-weight="700" fill="#7C2D12">2 · Major</text><text x="632" y="104" font-size="20" fill="#9A3412">Wall cracks, roof collapse</text><circle cx="850" cy="60" r="14" fill="#F97316"/></g>
<g class="c c4"><rect x="906" y="24" width="270" height="172" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/><text x="926" y="68" font-size="30" font-weight="700" fill="#7F1D1D">3 · Destroyed</text><text x="926" y="104" font-size="20" fill="#991B1B">Total structural failure</text><circle cx="1138" cy="60" r="14" fill="#EF4444"/></g></g>
<g class="t" font-size="18" fill="#475569"><text x="44" y="170">class weight 0.346</text><text x="338" y="170">class weight 2.873</text><text x="632" y="170">class weight 1.831</text><text x="926" y="170">class weight 4.593</text></g>
</svg>
